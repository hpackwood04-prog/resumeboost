<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResumeBoost – AI resume bullet optimizer</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a2e; background: #f7f8fc; }
  header { text-align: center; padding: 56px 16px 24px; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  p.sub { color: #555; max-width: 560px; margin: 0 auto; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 140px; padding: 12px; border: 1px solid #ccd; border-radius: 8px; font: inherit; }
  input { padding: 8px; border: 1px solid #ccd; border-radius: 8px; }
  button, a.btn { background: #4f46e5; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
  button:disabled { opacity: .6; }
  .row { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  #out { white-space: pre-wrap; background: #fff; border: 1px solid #dde; border-radius: 8px; padding: 12px; min-height: 40px; }
  #msg { color: #b00020; }
  .pricing { margin-top: 32px; background: #fff; border: 1px solid #dde; border-radius: 8px; padding: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>ResumeBoost</h1>
  <p class="sub">Paste your resume bullets and get concise, action-oriented, ATS-friendly rewrites in seconds.</p>
</header>
<main>
  <textarea id="text" placeholder="Paste resume bullets here..."></textarea>
  <div class="row">
    <button id="go">Improve</button>
    <input id="code" placeholder="Access code (after purchase)">
    <span id="remaining"></span>
  </div>
  <p id="msg"></p>
  <div id="out"></div>
  <section class="pricing">
    <h2>Unlimited access – $9/month</h2>
    <p>3 free tries, then upgrade for an access code.</p>
    <a class="btn" id="pay" href="#">Upgrade</a>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let paymentLink = "";
$("code").value = localStorage.getItem("code") || "";
$("pay").onclick = (e) => { if (!paymentLink) e.preventDefault(); else $("pay").href = paymentLink; };
$("go").onclick = async () => {
  $("msg").textContent = ""; $("go").disabled = true;
  localStorage.setItem("code", $("code").value);
  try {
    const r = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: $("text").value, code: $("code").value }),
    });
    const d = await r.json();
    if (!r.ok) {
      $("msg").textContent = d.error;
      if (d.paymentLink) { paymentLink = d.paymentLink; $("pay").href = paymentLink; }
    } else {
      $("out").textContent = d.result;
      $("remaining").textContent = d.remaining == null ? "" : `${d.remaining} free uses left`;
    }
  } catch { $("msg").textContent = "Network error."; }
  $("go").disabled = false;
};
</script>
</body>
</html>
